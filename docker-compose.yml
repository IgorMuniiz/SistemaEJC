services:
  mongodb:
    image: mongo:latest
    container_name: sistemaejc-mongodb
    restart: unless-stopped
    environment:
      # MONGO_INITDB_ROOT_USERNAME: admin
      # MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: EJCCOP
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
