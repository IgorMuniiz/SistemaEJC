<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EJC COP - Plataforma de Gestão e Inscrições</title>
    <style>
        @font-face {
            font-family: 'Tempting';
            src: url('public/fonts/tempting.otf') format('opentype'),
                    url('public/fonts/tempting.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .message {
            font-family: 'Tempting', cursive;
            font-size: 8rem;
            color: #fff;
            text-align: center;
        }

        .rose-img {
            width: 460px;
            height: auto;
        }

        @media (max-width: 1024px) {
            .message { font-size: 6rem; }
            .rose-img { width: 220px; }
        }

        @media (max-width: 768px) {
            .message { font-size: 4.0rem; }
            .rose-img { width: 180px; }
        }

        @media (max-width: 480px) {
            .message { font-size: 2.5rem; }
            .rose-img { width: 140px; }
        }

        @media (max-width: 360px) {
            .message { font-size: 2.0rem; }
            .rose-img { width: 110px; }
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 14px 18px 16px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(180deg, rgba(6, 16, 28, 0.1) 0%, rgba(10, 28, 44, 0.78) 100%);
            border-top: 1px solid rgba(148, 190, 220, 0.2);
            backdrop-filter: blur(5px);
            box-shadow: 0 -8px 24px rgba(4, 12, 22, 0.35);
        }

        .footer-main {
            margin: 0;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: rgba(227, 238, 249, 0.92);
        }

        .footer-sub {
            margin: 4px 0 0;
            font-size: 0.74rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(173, 201, 224, 0.76);
        }

        @media (max-width: 640px) {
            .footer-main {
                font-size: 0.82rem;
                line-height: 1.35;
            }

            .footer-sub {
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>
    <div class="message">
        Simplesmente amar...
    </div>
    <img class="rose-img" src="public/images/rosa-simplesmente-amar-sem-fundo.png" alt="O importante é a rosa">
    <footer class="footer">
        <p class="footer-main">&copy; 2026 EJC COP | Desenvolvido por Igor Muniz de Melo</p>
        <p class="footer-sub">Todos os direitos reservados</p>
    </footer>
</body>
</html>
